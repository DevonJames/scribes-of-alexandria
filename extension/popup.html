<!DOCTYPE html>

<body>
    <div class="popup-container">

        <!-- Registration/Login Screen -->
        <div id="auth-container" class="auth-container">
            <!-- Registration Form -->
            <div id="registration-form">
                <h1>Register</h1>
                <input type="text" id="register-email" placeholder="Email" required><br>
                <input type="password" id="register-password" placeholder="Password" required><br>
                <input type="password" id="register-confirm-password" placeholder="Confirm Password" required><br>
                <button id="register-btn">Register</button>
                <p id="register-error" class="error-message"></p>
            </div>

            <!-- Login Form -->
            <div id="login-form" class="hidden">
                <h1>Login</h1>
                <input type="text" id="login-email" placeholder="Email" required><br>
                <input type="password" id="login-password" placeholder="Password" required><br>
                <div class="spacer"></div>
                <button id="login-btn">Login</button>
                <p id="login-error" class="error-message"></p>
            </div>

            <p><a href="#" id="toggle-auth">Already have an account? Log in here.</a></p>

        </div>

        <div id="main-content" class="hidden">

            </div>

                <button class="tablinks" data-tab="Article">Article</button>
                <button class="tablinks" data-tab="Related">Related</button>
                <button class="tablinks" data-tab="Saved">Saved</button>
            </div>
            <!-- <button id="settings-btn" class="gear-button">
                <img src="gear-icon.svg" alt="Settings" />
            </button> -->

            <!-- Article Tab -->
            <div id="Article" class="tabcontent">
                <input type="text" id="domain" readonly><br>
                <div class="flex-container">
                    <input type="text" id="byline" placeholder="Author">
                    <input type="text" id="publish-date" placeholder="Publish Date">
                </div>
                <!-- Headline (can expand up to 3 lines) -->
                <textarea id="headline" placeholder="Article headline" readonly></textarea>

                    </a>
                    <a id="blockchain-link" href="#" target="_blank" class="inactive-link">

                    </a>
                </div> -->

                
                <div id="screenshot-container">
                    <img id="screenshot" src="" alt="Screenshot">
                </div>
                <!-- <input type="text" id="tags" placeholder="Comma-separated tags"><br> -->
                <div class="hidden">
                    <textarea id="tags" placeholder="Comma-separated tags" readonly></textarea>
                    <textarea id="description" placeholder="Short article description"></textarea>
                    <textarea id="content" placeholder="Article content"></textarea>
                    <br>
                    <audio id="audio-player" style="display: none;"></audio>
                    <!-- Description -->
                    <!-- Tags -->
                    
                    <button id="toggle-content-btn">Expand</button>
                
                    <!-- URL -->
                    <input type="text" id="url" placeholder="URL" readonly><br>
                    <input type="text" id="didTx" placeholder="DID TxID" readonly><br>
                </div>
            </div>
            <!-- Related Tab -->
            <div id="Related" class="tabcontent">
                <div id="related-articles-container" style="overflow-y: auto;">
                    <h4>Article Title</h4>
                    <p>Summary of the article...</p>
                    <small>Published on: Date</small>
                    <a href="#">Read it</a>

            <div id="Saved" class="tabcontent">

                <div id="saved-list">
                    <!-- Saved articles will be inserted here -->

            <!-- Sticky Bottom Buttons -->
            <div class="sticky-button-row">
                <button id="summarize-selected-btn">
                    <img src="noun-magic-podcast-7401756.svg" alt="Summarize Articles" title="Summarize Articles">
                </button>
                <button id="save-article-btn">
                    <img src="svgs/noun-archive-7196118.svg" alt="Save" title="Save">
                </button>
                <button id="brief-btn">
                    <img src="noun-play-6302389.svg" alt="Brief Me" title="Brief Me">
                </button>
                <button id="read-article-btn">
                    <a id="read-article-link" href="#" target="_blank" class="inactive-link">
                        <img src="svgs/noun-read-7196061.svg" alt="Read Article" title="Read Article">

                </button>
                <button id="metadata-link-btn">
                    <a id="metadata-link" href="#" target="_blank" class="inactive-link">

                </button>

                    <img src="svgs/noun-configure-7196220.svg" alt="Settings" />

        <div id="Settings" class="settings-container hidden">
            <section class="settings-section">
            <h3 class="settings-heading">Podcast Generator Settings</h3>
            <div class="settings-row-horizontal">
                <label for="llm-model" class="settings-label">LLM Model:</label>
                <span class="info-icon" title="Select the language model to use for generating podcast content.">
                <img src="svgs/noun-info-7408980.svg" alt="Info" style="width: 16px; height: 16px; filter: grayscale(100%);">
                </span>
                <select id="llm-model" class="settings-select">
                <option value="grok">Grok by xAI</option>
                <option value="gpt4" disabled>GPT-4 by OpenAI</option>
                <option value="llama3_3" disabled>LLaMa3.3 (70B)</option>
                </select>
            </div>
            
        
            <!-- <section class="settings-section"> -->
            <h3>Hosts</h3>
            <div class="bias-header">
                <div class="bias-label woke-label">WOKE</div>
                <div class="bias-label based-label">BASED</div>
            </div>
            <div class="settings-row-horizontal">
                <label for="host1" class="settings-label">1:</label>
                <select id="host1" class="settings-select half-width">
                <option value="" disabled selected>Select</option>
                <option value="socrates">Socrates</option>
                <option value="thomasJefferson">Thomas Jefferson</option>
                <option value="machiavelli">Niccolò Machiavelli</option>
                <option value="hypatia">Hypatia of Alexandria</option>
                <option value="leonardoDaVinci">Leonardo da Vinci</option>
                <option value="tesla">Nikola Tesla</option>
                <option value="cleopatra">Cleopatra</option>
                <option value="marieCurie">Marie Curie</option>
                <option value="sunTzu">Sun Tzu</option>
                <option value="joanOfArc">Joan of Arc</option>
                <option value="hercules">Hercules</option>
                <option value="virginiaWoolf">Virginia Woolf</option>
                <option value="adaLovelace">Ada Lovelace</option>
                <option value="rumi">Rumi</option>
                </select>
            <!-- </div> -->
                <div class="bias-container">
                <label>
                    <input type="radio" id="host1-woke" name="host1-personality" value="woke">
                    <img src="svgs/noun-radio-button-1954458.svg" alt="Woke">
                </label>
                <label>
                    <input type="radio" id="host1-based" name="host1-personality" value="based">
                    <img src="svgs/noun-radio-button-1954457.svg" alt="Based">
                </label>
                </div>
            </div>
            <div class="settings-row-horizontal">
                <label for="host2" class="settings-label">2:</label>
                <select id="host2" class="settings-select half-width">
                <option value="" disabled selected>Select</option>
                <option value="socrates">Socrates</option>
                <option value="thomasJefferson">Thomas Jefferson</option>
                <option value="machiavelli">Niccolò Machiavelli</option>
                <option value="hypatia">Hypatia of Alexandria</option>
                </select>
                <div class="bias-container">
                <label>
                    <input type="radio" id="host2-woke" name="host2-personality" value="woke">
                    <img src="svgs/noun-radio-button-1954458.svg" alt="Woke">
                </label>
                <label>
                    <input type="radio" id="host2-based" name="host2-personality" value="based">
                    <img src="svgs/noun-radio-button-1954457.svg" alt="Based">
                </label>
                </div>
            </div>
            <p id="host-error" class="error-message"></p>
            </section>

        
            <div class="settings-button-group">
            <div class="button-pair">
                <button id="account-btn" class="settings-button">Account</button>
                <button id="logout-btn" class="settings-button">Logout</button>
            </div>
            <button id="save-settings-btn" class="settings-button close-button">
                <img src="svgs/noun-close-button-4318169.svg" alt="Close" class="close-icon">
            </button>

        <h2 class="app-title">
            <span class="scribes-of">Scribes of</span>
            <span class="alexandria">ΛLΞXΛNDRIΛ</span>
        </h2>
        <div id="log-container">
            <canvas id="audio-visualizer" width="300" height="10"></canvas>
            <div id="message-line" class="log-output"></div>
            <button id="expand-btn" class="expand-button">⇔</button>
        </div>
    </footer>
